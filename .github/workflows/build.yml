name: Build NEXUS APK
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: nexus-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    name: Tests and installable APK
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Run unit tests and assemble APK
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug
      - name: Build summary
        if: always()
        run: |
          echo '## NEXUS Sidekick v0.6' >> "$GITHUB_STEP_SUMMARY"
          echo 'Build job: ${{ job.status }}' >> "$GITHUB_STEP_SUMMARY"
          echo 'Commit: ${{ github.sha }}' >> "$GITHUB_STEP_SUMMARY"
          echo 'Microphone and accessibility behavior must be checked on a physical phone.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-SIDEKICK-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-BUILD-REPORTS
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7
